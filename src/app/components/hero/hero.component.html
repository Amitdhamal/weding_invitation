<header [style.--hero]="w.heroImage ? 'url(' + w.heroImage + ')' : 'none'">
  <app-feather class="ft fl" /><app-feather class="ft fr" />
  <div class="in">
    <p class="invitation-title"><b>{{ w.header }}</b></p>
    <div class="sym"><app-sacred kind="swastik" /><app-sacred kind="om" class="om" /><app-sacred kind="swastik" /></div>
    <p class="shloka">॥ श्री गणेशाय नमः ॥ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ॥ श्री गणेशाय नमः ॥ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;॥ श्री गणेशाय नमः ॥</p>
    <h1>
      <span style="margin-top: 20px;"><small>चि. सौ. कां.</small>{{ w.bride }}</span><span class="amp">आणि</span>
      <span><small>चि.</small>{{ w.groom }}</span>
    </h1>
    <p class="sub">यांचा शुभविवाह</p>
    <!-- <p class="sub">{{ w.groomEn }} &amp; {{ w.brideEn }} यांचा शुभविवाह</p> -->
    <p class="when">{{ dateLabel }}</p>
  </div>
  <a class="scroll-down" href="#invitation" aria-label="खालील माहिती पाहण्यासाठी स्क्रोल करा">
    <span>खाली स्क्रोल करा</span>
    <i aria-hidden="true"></i>
  </a>
</header>
