<p class="label">आमंत्रण मिळाल्याची पुष्टी</p>
<!-- <h3>कृपया उपस्थिती कळवा</h3> -->
 <h3>कृपया प्रतिसाद द्या</h3>
<ol>
  <li>QR कोड मोबाईलने स्कॅन करा, किंवा खालील "WhatsApp वर कळवा" बटण दाबा.</li>
  <li>WhatsApp उघडेल.</li>
  <li>“Send” दाबा. उपस्थिती थेट आयोजकांपर्यंत पोहोचेल.</li>
</ol>
<figure>
  @if (qr()) {
    <img [src]="qr()" alt="RSVP QR code">
    <figcaption>कृपया स्कॅन करा आणि प्रतिसाद द्या</figcaption>
  } @else {
    <p>{{ qrError() || 'QR कोड तयार होत आहे...' }}</p>
  }
</figure>
<div class="btns">
  @if (rsvpUrl) {
    <a [href]="rsvpUrl" target="_blank" rel="noopener noreferrer">WhatsApp वर कळवा</a>
  } @else {
    <span>WhatsApp लिंक उपलब्ध नाही.</span>
  }
  <button type="button" class="alt" (click)="share()">आमंत्रण शेअर करा</button>
</div>
