<app-section-title>निमंत्रक</app-section-title>
<ul class="contacts">
  @for (person of contactPeople; track person.name) {
    <li>
      @if (person.phone) {
        <a class="contact-card" [href]="'tel:' + person.phone"
          [attr.aria-label]="person.name + ' यांना कॉल करण्यासाठी टॅप करा'">
          <strong>{{ person.name }}</strong>
          <span class="phone-number">{{ person.phone }}</span>
          <span class="call-action">कॉल करण्यासाठी येथे टॅप करा</span>
        </a>
      } @else {
        <div class="contact-card">
          <strong>{{ person.name }}</strong>
          <span>मोबाईल नंबर येथे भरा</span>
        </div>
      }
    </li>
  }
</ul>
