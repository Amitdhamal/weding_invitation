<p class="label">📍 विवाहस्थळ</p>
<h3>{{ w.venue }}</h3>
<p>{{ w.address }}.</p>
<figure>
  @if (qr()) {
    <img [src]="qr()" alt="Venue map QR code">
    <figcaption>स्कॅन करा आणि विवाहस्थळाकडे येण्याचा मार्ग पाहा</figcaption>
  } @else {
    <p>{{ qrError() || 'QR कोड तयार होत आहे...' }}</p>
  }
</figure>
<div class="btns">
  @if (mapUrl) {
    <a [href]="mapUrl" target="_blank" rel="noopener noreferrer">नकाशा उघडा</a>
  } @else {
    <span>नकाशाची लिंक उपलब्ध नाही.</span>
  }
  <a class="alt" [href]="calUrl" target="_blank" rel="noopener noreferrer">Google कॅलेंडरमध्ये जोडा</a>
</div>
